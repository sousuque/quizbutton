<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>quizbutton</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12162a;
  --panel: #1b2140;
  --panel-alt: #212849;
  --border: #2c3358;
  --red: #e8484b;
  --red-dark: #c93638;
  --gold: #f0b429;
  --text: #f3f1ea;
  --muted: #8b93b8;
}
* { box-sizing: border-box; }
body { margin: 0; }

.qm-app {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Yusei Magic', sans-serif;
  padding: 32px 16px 64px;
}
.qm-wrap { max-width: 880px; margin: 0 auto; }

.qm-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.qm-title {
  font-family: 'Yusei Magic', sans-serif;
  font-weight: 400;
  font-size: 26px;
  margin: 0;
  letter-spacing: 0.02em;
}
.qm-hint { font-size: 12px; color: var(--muted); margin: 0 0 20px 4px; }
.qm-sound-toggle { flex-shrink: 0; }
.qm-sound-toggle.is-muted { border-color: var(--red); color: #ff8385; }

.qm-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }

.qm-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

.qm-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  font-size: 14px;
  font-family: 'Yusei Magic', sans-serif;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
  white-space: nowrap;
}
.qm-btn:hover { border-color: var(--gold); }
.qm-btn-primary { background: var(--red); border-color: var(--red-dark); color: #fff; }
.qm-btn-primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
.qm-btn-danger { background: transparent; border-color: var(--red); color: #ff8385; }
.qm-btn-danger:hover { background: var(--red); border-color: var(--red-dark); color: #fff; }
.qm-btn-lg { padding: 16px 30px; font-size: 17px; border-radius: 12px; }
.qm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.qm-btn:disabled:hover { border-color: var(--border); background: var(--panel-alt); }

.qm-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 15px;
  font-family: 'Yusei Magic', sans-serif;
}
.qm-input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.15);
}
.qm-field { margin-bottom: 16px; }
.qm-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }

.qm-btn:focus-visible, .qm-input:focus-visible, .qm-buzzer:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* ---- empty state ---- */
.qm-empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.qm-empty-title { font-family: 'Yusei Magic', sans-serif; font-size: 17px; color: var(--text); margin-bottom: 8px; }
.qm-empty p { margin: 0 0 16px; font-size: 13px; }

/* ---- status line ---- */
.qm-status-line { margin-top: 14px; font-size: 13px; color: var(--muted); text-align: center; }
.qm-status-line.gold { color: var(--gold); }
.qm-status-line.red { color: #ff8385; }

/* ---- central buzz display ---- */
.qm-buzz-stage {
  text-align: center;
  padding: 28px 16px;
  border-radius: 14px;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.qm-buzz-stage.locked {
  border-color: var(--red);
  background: linear-gradient(135deg, rgba(232, 72, 75, 0.16), rgba(232, 72, 75, 0.04));
  box-shadow: 0 0 26px rgba(232, 72, 75, 0.25);
}
.qm-buzz-stage.solved {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(240, 180, 41, 0.16), rgba(240, 180, 41, 0.04));
  box-shadow: 0 0 26px rgba(240, 180, 41, 0.2);
}
.qm-buzz-idle { font-size: 14px; color: var(--muted); }
.qm-buzz-clock {
  font-family: 'Yusei Magic', sans-serif;
  font-size: 44px;
  letter-spacing: 0.03em;
  color: var(--text);
}
.qm-buzz-clock-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
.qm-buzz-name { font-size: 30px; color: var(--red); font-weight: 400; }
.qm-buzz-stage.solved .qm-buzz-name { color: var(--gold); }
.qm-buzz-time { font-size: 18px; color: var(--text); margin-top: 6px; }
.qm-buzz-result-tag { font-size: 13px; color: var(--gold); margin-top: 8px; }

.qm-judge-row { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

/* ---- buzzer buttons grid ---- */
.qm-buzzer-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}
.qm-buzzer {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 16px 22px;
  min-width: 120px;
  border-radius: 16px;
  font-family: 'Yusei Magic', sans-serif;
  font-size: 16px;
  color: var(--muted);
  background: var(--panel);
  border: none;
  border-bottom: 4px solid var(--border);
  cursor: pointer;
  transition: all 0.15s ease;
}
.qm-buzzer:hover { color: var(--text); }
.qm-buzzer:active { transform: translateY(2px); border-bottom-width: 2px; }
.qm-buzzer.active {
  background: var(--red);
  color: #fff;
  border-bottom-color: var(--red-dark);
  box-shadow: 0 0 22px rgba(232, 72, 75, 0.4);
}
.qm-buzzer.queued {
  color: var(--gold);
  border-bottom-color: var(--gold);
}
.qm-buzzer.out {
  opacity: 0.35;
  cursor: not-allowed;
}
.qm-buzzer-key {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--border);
}
.qm-buzzer.active .qm-buzzer-key { background: rgba(255,255,255,0.2); color: #fff; border-color: transparent; }
.qm-buzzer-order {
  position: absolute;
  top: -8px;
  right: -6px;
  font-size: 11px;
  background: var(--gold);
  color: #1b2140;
  border-radius: 999px;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

/* ---- scoreboard ---- */
.qm-scoreboard-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.qm-scoreboard-title { font-size: 15px; margin: 0; color: var(--text); }
.qm-score-mode-select { width: auto; min-width: 130px; padding: 6px 10px; font-size: 13px; }
.qm-score-points-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.qm-score-points-label { display: flex; align-items: center; gap: 2px; }
.qm-points-input {
  width: 48px;
  margin: 0 4px;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  text-align: center;
  font-size: 13px;
}
.qm-participant-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 10px 10px 14px;
  margin-bottom: 10px;
}
.qm-participant-row.is-turn { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.qm-participant-key {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.qm-participant-name { flex: 1; min-width: 0; font-size: 14px; word-break: break-word; }
.qm-score-control { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.qm-score-btn {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 13px;
  padding: 0;
  line-height: 1;
}
.qm-score-btn:hover { border-color: var(--gold); }
.qm-score-value { min-width: 26px; text-align: center; font-size: 14px; font-weight: 700; color: var(--gold); }
.qm-count-control { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.qm-count-value {
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  user-select: none;
}
.qm-count-value:hover { border-color: var(--gold); }
.qm-count-value.qm-count-correct { color: var(--gold); }
.qm-count-value.qm-count-wrong { color: var(--red); }
.qm-participant-remove {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  flex-shrink: 0;
  padding: 2px 4px;
}
.qm-participant-remove:hover { color: #ff8385; }

/* ---- kebab menu ---- */
.qm-kebab-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  flex-shrink: 0;
  padding: 4px 8px;
  border-radius: 6px;
}
.qm-kebab-btn:hover, .qm-kebab-btn.is-open { color: var(--text); background: var(--bg); }
.qm-kebab-menu {
  position: fixed;
  min-width: 130px;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  z-index: 60;
}
.qm-kebab-menu-item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--text);
  padding: 9px 10px;
  font-family: 'Yusei Magic', sans-serif;
  font-size: 13px;
  cursor: pointer;
  border-radius: 7px;
}
.qm-kebab-menu-item:hover { background: var(--bg); }
.qm-kebab-menu-item.danger { color: #ff8385; }

/* ---- modal ---- */
.qm-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 8, 18, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
}
.qm-modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 360px; width: 100%; }
.qm-modal-title { font-family: 'Yusei Magic', sans-serif; font-size: 16px; margin-bottom: 16px; }
.qm-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
.qm-key-picker-btn {
  width: 100%;
  justify-content: center;
  font-size: 15px;
  padding: 12px 14px;
}
.qm-key-picker-btn.picking {
  border-color: var(--gold);
  color: var(--gold);
  animation: qm-pulse 1s ease-in-out infinite;
}
@keyframes qm-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(240, 180, 41, 0.4); }
  50% { box-shadow: 0 0 0 6px rgba(240, 180, 41, 0); }
}
.qm-modal-error { font-size: 12px; color: #ff8385; margin: -8px 0 14px; min-height: 14px; }

.qm-hidden { display: none !important; }
</style>
</head>
<body>
<div class="qm-app">
  <div class="qm-wrap">
    <div class="qm-header">
      <h1 class="qm-title">quizbutton</h1>
      <button class="qm-btn qm-sound-toggle" type="button" id="btn-sound-toggle" aria-pressed="false">🔊 音：オン</button>
    </div>
    <p class="qm-hint">スペースキーで「問題を始める」／「問題を終わる」を切り替えられます。プレイヤーはボタンクリックか割り当てられたキーで解答権を得ます。解答権発生後は ← キーで正解、→ キーで誤答と判定できます。</p>

    <div class="qm-card">
      <div class="qm-field" style="margin-bottom:0;">
        <label class="qm-label" for="rule-select">ルール</label>
        <select class="qm-input" id="rule-select" style="width:auto; min-width:260px;">
          <option value="single">シングルチャンス</option>
          <option value="endless">エンドレスチャンス</option>
          <option value="rest">他の人が誤答するまで休み</option>
        </select>
      </div>
    </div>

    <div class="qm-card">
      <div class="qm-toolbar">
        <button class="qm-btn qm-btn-primary" type="button" id="btn-add-player">＋ プレイヤーを追加</button>
        <button class="qm-btn qm-btn-primary qm-btn-lg" type="button" id="btn-start">▶ 問題を始める</button>
        <button class="qm-btn qm-btn-danger qm-btn-lg" type="button" id="btn-end">■ 問題を終わる</button>
      </div>
      <div class="qm-status-line" id="status-line"></div>
    </div>

    <div class="qm-card">
      <div class="qm-buzz-stage" id="buzz-stage">
        <div class="qm-buzz-idle" id="buzz-idle">「問題を始める」を押すと解答受付が始まります</div>
      </div>
      <div class="qm-judge-row qm-hidden" id="judge-row">
        <button class="qm-btn qm-btn-primary" type="button" id="btn-correct">⭕ 正解</button>
        <button class="qm-btn qm-btn-danger" type="button" id="btn-wrong">❌ 誤答</button>
      </div>
      <div class="qm-buzzer-grid" id="buzzer-grid"></div>
      <div class="qm-empty qm-hidden" id="empty-state">
        <div class="qm-empty-title">プレイヤーがいません</div>
        <p>「プレイヤーを追加」から参加者を登録してください。</p>
      </div>
    </div>

    <div class="qm-card qm-hidden" id="scoreboard-card">
      <div class="qm-scoreboard-header">
        <h2 class="qm-scoreboard-title">得点板</h2>
        <select class="qm-input qm-score-mode-select" id="score-mode-select">
          <option value="score">点数</option>
          <option value="count">n○ n✕</option>
        </select>
      </div>
      <div class="qm-score-points-row" id="score-points-row">
        <label class="qm-score-points-label">正解 +<input type="number" class="qm-points-input" id="correct-points-input" min="0" step="1" value="1">点</label>
        <label class="qm-score-points-label">誤答 −<input type="number" class="qm-points-input" id="wrong-points-input" min="0" step="1" value="1">点</label>
      </div>
      <div id="scoreboard-list"></div>
      <div class="qm-toolbar" style="margin-top: 14px;">
        <button class="qm-btn" type="button" id="btn-clear-scores">点数をクリア</button>
        <button class="qm-btn qm-btn-danger" type="button" id="btn-clear-players">プレイヤーをクリア</button>
      </div>
    </div>
  </div>
</div>

<div class="qm-modal-backdrop qm-hidden" id="modal-backdrop">
  <div class="qm-modal" data-stop="1">
    <div class="qm-modal-title" id="modal-title">プレイヤーを追加</div>
    <div class="qm-field">
      <label class="qm-label" for="modal-name-input">名前</label>
      <input class="qm-input" id="modal-name-input" type="text" maxlength="20" placeholder="プレイヤー名" autocomplete="off">
    </div>
    <div class="qm-field">
      <label class="qm-label">使用するキー</label>
      <button class="qm-btn qm-key-picker-btn" type="button" id="btn-pick-key">キーを選択</button>
    </div>
    <div class="qm-modal-error" id="modal-error"></div>
    <div class="qm-modal-actions">
      <button class="qm-btn" type="button" id="btn-modal-cancel">キャンセル</button>
      <button class="qm-btn qm-btn-primary" type="button" id="btn-modal-confirm">追加</button>
    </div>
  </div>
</div>

<div class="qm-kebab-menu qm-hidden" id="kebab-menu">
  <button class="qm-kebab-menu-item" type="button" id="kebab-edit">✎ 編集</button>
  <button class="qm-kebab-menu-item danger" type="button" id="kebab-delete">✕ 削除</button>
</div>

<audio id="audio-buzz" src="button.mp3" preload="auto"></audio>
<audio id="audio-correct" src="seikai.mp3" preload="auto"></audio>
<audio id="audio-wrong" src="gotou.mp3" preload="auto"></audio>

<script>
(function () {
  'use strict';

  var state = {
    players: [],           // {id, name, key, score}
    rule: 'single',         // 'single' | 'endless' | 'rest'
    scoreMode: 'score',      // 'score' | 'count'
    correctPoints: 1,        // 「点数」モードで正解時に加算する点数
    wrongPoints: 1,           // 「点数」モードで誤答時に減算する点数
    soundOn: true,            // 効果音のオン/オフ
    quizActive: false,      // 解答受付中かどうか（開始〜正解 まで）
    startTime: null,        // performance.now() at start
    lastElapsed: 0,          // 直近の解答権獲得時のタイム
    buzzedSet: {},           // id -> true (この問題で一度でも押した。表示用)
    restingSet: {},          // id -> true (「他の人が誤答するまで休み」で休み中)
    singleLocked: false,     // 「シングルチャンス」で誰かが一度押した後 true
    currentId: null,         // 解答権を持つプレイヤーのid
    queue: [],                // [{id, time}] エンドレスチャンスでの解答待ち行列
    solved: false,           // 正解が出て終了した
    roundEnded: false,       // 誤答/終了などで、この問題の受付が終わった（正解ではない）
    picking: false           // モーダル内でキー選択待ちか
  };
  var pickedKey = null;
  var editingId = null;
  var kebabTargetId = null;
  var clockRAF = null;
  var uidSeed = 1;

  function genId() { return 'p' + (uidSeed++) + '-' + Date.now().toString(36); }

  var STORAGE_KEY = 'hayaoshi-buzzer-players-v1';

  function savePlayers() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.players));
    } catch (e) { /* localStorageが使えない環境では無視 */ }
  }

  function loadPlayers() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return;
      state.players = arr.filter(function (p) { return p && p.name && p.key; }).map(function (p) {
        return {
          id: p.id || genId(),
          name: String(p.name),
          key: String(p.key),
          score: Number(p.score) || 0,
          correct: Number(p.correct) || 0,
          wrong: Number(p.wrong) || 0
        };
      });
    } catch (e) { /* 読み込みに失敗した場合は無視 */ }
  }

  var el = {
    btnAddPlayer: document.getElementById('btn-add-player'),
    btnStart: document.getElementById('btn-start'),
    btnEnd: document.getElementById('btn-end'),
    btnSoundToggle: document.getElementById('btn-sound-toggle'),
    ruleSelect: document.getElementById('rule-select'),
    scoreModeSelect: document.getElementById('score-mode-select'),
    scorePointsRow: document.getElementById('score-points-row'),
    correctPointsInput: document.getElementById('correct-points-input'),
    wrongPointsInput: document.getElementById('wrong-points-input'),
    audioBuzz: document.getElementById('audio-buzz'),
    audioCorrect: document.getElementById('audio-correct'),
    audioWrong: document.getElementById('audio-wrong'),
    statusLine: document.getElementById('status-line'),
    buzzStage: document.getElementById('buzz-stage'),
    judgeRow: document.getElementById('judge-row'),
    btnCorrect: document.getElementById('btn-correct'),
    btnWrong: document.getElementById('btn-wrong'),
    buzzerGrid: document.getElementById('buzzer-grid'),
    emptyState: document.getElementById('empty-state'),
    scoreboardCard: document.getElementById('scoreboard-card'),
    btnClearScores: document.getElementById('btn-clear-scores'),
    btnClearPlayers: document.getElementById('btn-clear-players'),
    scoreboardList: document.getElementById('scoreboard-list'),
    modalBackdrop: document.getElementById('modal-backdrop'),
    modalTitle: document.getElementById('modal-title'),
    modalNameInput: document.getElementById('modal-name-input'),
    btnPickKey: document.getElementById('btn-pick-key'),
    modalError: document.getElementById('modal-error'),
    btnModalCancel: document.getElementById('btn-modal-cancel'),
    btnModalConfirm: document.getElementById('btn-modal-confirm'),
    kebabMenu: document.getElementById('kebab-menu'),
    kebabEdit: document.getElementById('kebab-edit'),
    kebabDelete: document.getElementById('kebab-delete')
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function findPlayer(id) {
    for (var i = 0; i < state.players.length; i++) {
      if (state.players[i].id === id) return state.players[i];
    }
    return null;
  }

  // ---- 低遅延サウンド再生 ----
  // HTMLAudioElement の .play() は再生開始までに数十〜数百msの遅延が
  // 発生することがあるため、Web Audio API でデコード済みバッファを
  // 即時再生する。Web Audio が使えない環境（file:// での fetch 制限など）
  // では、複数の <audio> 要素をプールして交互に再生するフォールバックを使う。
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var audioCtx = AudioCtx ? new AudioCtx() : null;
  var soundSources = { buzz: 'button.mp3', correct: 'seikai.mp3', wrong: 'gotou.mp3' };
  var soundBuffers = {};   // key -> decoded AudioBuffer（成功時のみ）
  var soundPools = {};     // key -> [HTMLAudioElement, ...]（フォールバック用）
  var POOL_SIZE = 4;

  function buildPool(key, srcEl) {
    var pool = [];
    for (var i = 0; i < POOL_SIZE; i++) {
      var a = srcEl.cloneNode(true);
      a.removeAttribute('id');
      pool.push(a);
    }
    soundPools[key] = pool;
    soundPools[key + '_idx'] = 0;
  }

  function loadBuffer(key, url) {
    if (!audioCtx) return;
    fetch(url)
      .then(function (res) { return res.arrayBuffer(); })
      .then(function (buf) { return audioCtx.decodeAudioData(buf); })
      .then(function (decoded) { soundBuffers[key] = decoded; })
      .catch(function () { /* デコード失敗時はプール再生にフォールバック */ });
  }

  buildPool('buzz', el.audioBuzz);
  buildPool('correct', el.audioCorrect);
  buildPool('wrong', el.audioWrong);
  Object.keys(soundSources).forEach(function (key) {
    loadBuffer(key, soundSources[key]);
  });

  function playViaPool(key) {
    var pool = soundPools[key];
    if (!pool || !pool.length) return;
    var idx = soundPools[key + '_idx'] % pool.length;
    soundPools[key + '_idx'] = idx + 1;
    var a = pool[idx];
    try {
      a.currentTime = 0;
      a.play();
    } catch (e) { /* 再生できない環境では無視 */ }
  }

  function playSound(key) {
    if (!state.soundOn) return;
    // ユーザー操作（ボタン押下）の直後に呼ばれるので、ここで resume して良い
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    var buffer = soundBuffers[key];
    if (audioCtx && buffer) {
      try {
        var source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        return;
      } catch (e) { /* 失敗時はプール再生にフォールバック */ }
    }
    playViaPool(key);
  }

  function updateSoundToggleUI() {
    if (state.soundOn) {
      el.btnSoundToggle.textContent = '🔊 音：オン';
      el.btnSoundToggle.classList.remove('is-muted');
      el.btnSoundToggle.setAttribute('aria-pressed', 'false');
    } else {
      el.btnSoundToggle.textContent = '🔇 音：オフ';
      el.btnSoundToggle.classList.add('is-muted');
      el.btnSoundToggle.setAttribute('aria-pressed', 'true');
    }
  }
  el.btnSoundToggle.addEventListener('click', function () {
    state.soundOn = !state.soundOn;
    updateSoundToggleUI();
  });
  updateSoundToggleUI();

  state.rule = el.ruleSelect.value;
  el.ruleSelect.addEventListener('change', function () {
    state.rule = el.ruleSelect.value;
  });

  state.scoreMode = el.scoreModeSelect.value;
  function updateScorePointsRowVisibility() {
    if (state.scoreMode === 'score') {
      el.scorePointsRow.classList.remove('qm-hidden');
    } else {
      el.scorePointsRow.classList.add('qm-hidden');
    }
  }
  el.scoreModeSelect.addEventListener('change', function () {
    state.scoreMode = el.scoreModeSelect.value;
    updateScorePointsRowVisibility();
    renderScoreboard();
  });
  updateScorePointsRowVisibility();

  function parsePoints(input, fallback) {
    var v = parseFloat(input.value);
    if (isNaN(v) || v < 0) v = fallback;
    return v;
  }
  el.correctPointsInput.addEventListener('change', function () {
    state.correctPoints = parsePoints(el.correctPointsInput, state.correctPoints);
    el.correctPointsInput.value = state.correctPoints;
  });
  el.wrongPointsInput.addEventListener('change', function () {
    state.wrongPoints = parsePoints(el.wrongPointsInput, state.wrongPoints);
    el.wrongPointsInput.value = state.wrongPoints;
  });

  // ---------------- modal (add / edit player) ----------------
  function openModal(editPlayer) {
    editingId = editPlayer ? editPlayer.id : null;
    pickedKey = editPlayer ? editPlayer.key : null;
    state.picking = false;
    el.modalTitle.textContent = editPlayer ? 'プレイヤーを編集' : 'プレイヤーを追加';
    el.modalNameInput.value = editPlayer ? editPlayer.name : '';
    el.btnPickKey.textContent = editPlayer ? '選択したキー：' + editPlayer.key + '（変更する）' : 'キーを選択';
    el.btnPickKey.classList.remove('picking');
    el.modalError.textContent = '';
    el.btnModalConfirm.textContent = editPlayer ? '保存' : '追加';
    el.modalBackdrop.classList.remove('qm-hidden');
    el.modalNameInput.focus();
  }
  function closeModal() {
    state.picking = false;
    editingId = null;
    el.modalBackdrop.classList.add('qm-hidden');
  }
  function startKeyPicking() {
    state.picking = true;
    el.btnPickKey.textContent = 'キーを押してください… (A〜Z)';
    el.btnPickKey.classList.add('picking');
    el.modalError.textContent = '';
  }
  function finishKeyPicking(letter) {
    var usedBy = null;
    for (var i = 0; i < state.players.length; i++) {
      if (state.players[i].key === letter && state.players[i].id !== editingId) usedBy = state.players[i];
    }
    if (usedBy) {
      el.modalError.textContent = 'そのキーは「' + usedBy.name + '」が使用中です。';
      state.picking = false;
      el.btnPickKey.textContent = 'キーを選択';
      el.btnPickKey.classList.remove('picking');
      return;
    }
    pickedKey = letter;
    state.picking = false;
    el.btnPickKey.textContent = '選択したキー：' + letter + '（変更する）';
    el.btnPickKey.classList.remove('picking');
    el.modalError.textContent = '';
  }
  function confirmModal() {
    var name = el.modalNameInput.value.trim();
    if (!name) {
      el.modalError.textContent = '名前を入力してください。';
      return;
    }
    if (!pickedKey) {
      el.modalError.textContent = '使用するキーを選択してください。';
      return;
    }
    if (editingId) {
      var target = findPlayer(editingId);
      if (target) {
        target.name = name;
        target.key = pickedKey;
      }
      closeModal();
      setStatus('「' + name + '」を更新しました。', '');
      renderAll();
      return;
    }
    state.players.push({ id: genId(), name: name, key: pickedKey, score: 0, correct: 0, wrong: 0 });
    closeModal();
    setStatus('「' + name + '」を追加しました。', '');
    renderAll();
  }

  el.btnAddPlayer.addEventListener('click', function () { openModal(); });
  el.btnModalCancel.addEventListener('click', closeModal);
  el.btnModalConfirm.addEventListener('click', confirmModal);
  el.btnPickKey.addEventListener('click', startKeyPicking);
  el.modalBackdrop.addEventListener('click', function (e) {
    if (e.target === el.modalBackdrop) closeModal();
  });
  el.modalNameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); confirmModal(); }
  });

  // ---------------- kebab menu ----------------
  function closeKebabMenu() {
    kebabTargetId = null;
    el.kebabMenu.classList.add('qm-hidden');
  }
  function openKebabMenu(btn, id) {
    kebabTargetId = id;
    var rect = btn.getBoundingClientRect();
    el.kebabMenu.style.top = (rect.bottom + 6) + 'px';
    el.kebabMenu.style.left = 'auto';
    el.kebabMenu.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
    el.kebabMenu.classList.remove('qm-hidden');
  }
  document.addEventListener('click', function (e) {
    if (el.kebabMenu.classList.contains('qm-hidden')) return;
    if (e.target.closest('.qm-kebab-menu') || e.target.closest('[data-action="kebab"]')) return;
    closeKebabMenu();
  });
  el.kebabEdit.addEventListener('click', function () {
    var id = kebabTargetId;
    closeKebabMenu();
    var p = findPlayer(id);
    if (p) openModal(p);
  });
  el.kebabDelete.addEventListener('click', function () {
    var id = kebabTargetId;
    closeKebabMenu();
    var p = findPlayer(id);
    if (!p) return;
    state.players = state.players.filter(function (x) { return x.id !== id; });
    if (state.currentId === id) state.currentId = null;
    setStatus('「' + p.name + '」を削除しました。', '');
    renderAll();
  });

  // ---------------- quiz flow ----------------
  function setStatus(msg, cls) {
    el.statusLine.textContent = msg;
    el.statusLine.className = 'qm-status-line' + (cls ? ' ' + cls : '');
  }

  function startQuestion() {
    if (state.players.length === 0) {
      setStatus('先にプレイヤーを追加してください。', 'red');
      return;
    }
    state.quizActive = true;
    state.solved = false;
    state.roundEnded = false;
    state.startTime = performance.now();
    state.lastElapsed = 0;
    state.buzzedSet = {};
    state.restingSet = {};
    state.singleLocked = false;
    state.currentId = null;
    state.queue = [];
    setStatus('解答受付中…', 'gold');
    renderAll();
    runClock();
  }

  function endQuestion() {
    if (clockRAF) { cancelAnimationFrame(clockRAF); clockRAF = null; }
    state.quizActive = false;
    state.solved = false;
    state.roundEnded = false;
    state.startTime = null;
    state.lastElapsed = 0;
    state.buzzedSet = {};
    state.restingSet = {};
    state.singleLocked = false;
    state.currentId = null;
    state.queue = [];
    setStatus('問題を終了しました。', '');
    renderAll();
  }

  function runClock() {
    if (clockRAF) cancelAnimationFrame(clockRAF);
    function tick() {
      if (!state.quizActive || state.currentId !== null) { clockRAF = null; return; }
      renderBuzzStage();
      clockRAF = requestAnimationFrame(tick);
    }
    clockRAF = requestAnimationFrame(tick);
  }

  function handleBuzz(id) {
    if (!state.quizActive) return;

    if (state.rule === 'endless') {
      if (id === state.currentId) return; // 現在解答中の本人
      if (queueHasId(id)) return; // 既に待機列にいる
      var elapsedE = (performance.now() - state.startTime) / 1000;
      state.buzzedSet[id] = true;
      playSound('buzz');
      var pe = findPlayer(id);
      if (state.currentId === null) {
        state.currentId = id;
        state.lastElapsed = elapsedE;
        setStatus(pe ? pe.name + ' さんが解答権を得ました。' : '', 'red');
      } else {
        state.queue.push({ id: id, time: elapsedE });
        setStatus(pe ? pe.name + ' さんが解答待ちに加わりました。' : '', '');
      }
      renderAll();
      return;
    }

    if (state.currentId !== null) return; // 誰かが解答中は割り込めない

    if (state.rule === 'single' && state.singleLocked) return; // 既に誰かが押した
    if (state.rule === 'rest' && state.restingSet[id]) return; // 休み中

    var elapsed = (performance.now() - state.startTime) / 1000;
    state.lastElapsed = elapsed;
    state.buzzedSet[id] = true;
    state.currentId = id;
    if (state.rule === 'single') state.singleLocked = true;

    playSound('buzz');

    var p = findPlayer(id);
    setStatus(p ? p.name + ' さんが解答権を得ました。' : '', 'red');
    renderAll();
  }

  function queueHasId(id) {
    for (var i = 0; i < state.queue.length; i++) {
      if (state.queue[i].id === id) return true;
    }
    return false;
  }

  function judge(result) {
    if (!state.quizActive || state.currentId === null) return;
    var p = findPlayer(state.currentId);
    if (!p) return;

    if (result === 'correct') {
      p.score += state.correctPoints;
      p.correct = (p.correct || 0) + 1;
      state.quizActive = false;
      state.solved = true;
      state.roundEnded = false;
      state.currentId = null;
      state.queue = [];
      playSound('correct');
      setStatus(p.name + ' さん正解！ +1点', 'gold');
      renderAll();
      return;
    }

    // 誤答
    p.score -= state.wrongPoints;
    p.wrong = (p.wrong || 0) + 1;
    playSound('wrong');

    if (state.rule === 'single') {
      // シングルチャンス: 誤答でもそのまま問題終了
      state.quizActive = false;
      state.solved = false;
      state.roundEnded = true;
      state.currentId = null;
      setStatus(p.name + ' さん誤答… -1点。この問題は終了しました。', 'red');
    } else if (state.rule === 'endless') {
      // エンドレスチャンス: 待機列がいれば押した順に次の解答権へ、いなければ再び受付
      if (state.queue.length > 0) {
        var next = state.queue.shift();
        state.currentId = next.id;
        state.lastElapsed = next.time;
        var np = findPlayer(next.id);
        setStatus(p.name + ' さん誤答… -1点。次は ' + (np ? np.name : '') + ' さんの解答権です。', 'red');
      } else {
        state.currentId = null;
        setStatus(p.name + ' さん誤答… -1点。解答受付中…', 'gold');
        runClock();
      }
    } else {
      // 他の人が誤答するまで休み
      state.restingSet = {};
      state.restingSet[state.currentId] = true;
      state.currentId = null;
      setStatus(p.name + ' さん誤答… -1点。他の人が誤答するまで休みです。解答受付中…', 'gold');
      runClock();
    }
    renderAll();
  }

  el.btnStart.addEventListener('click', startQuestion);
  el.btnEnd.addEventListener('click', endQuestion);
  el.btnCorrect.addEventListener('click', function () { judge('correct'); });
  el.btnWrong.addEventListener('click', function () { judge('wrong'); });

  // ---------------- key handling ----------------
  document.addEventListener('keydown', function (e) {
    // モーダルでキー選択待ちの場合はそれを優先
    if (!el.modalBackdrop.classList.contains('qm-hidden')) {
      if (state.picking) {
        var m = /^Key([A-Z])$/.exec(e.code);
        var letter = m ? m[1] : (/^[a-zA-Z]$/.test(e.key) ? e.key.toUpperCase() : null);
        if (letter) {
          e.preventDefault();
          finishKeyPicking(letter);
        }
      }
      return; // モーダル表示中は他のキー操作を無効化
    }

    var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea') return;

    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (!state.quizActive) startQuestion();
      else endQuestion();
      return;
    }

    if (e.code === 'ArrowLeft') {
      e.preventDefault();
      judge('correct');
      return;
    }

    if (e.code === 'ArrowRight') {
      e.preventDefault();
      judge('wrong');
      return;
    }

    var km = /^Key([A-Z])$/.exec(e.code);
    var pressedLetter = km ? km[1] : (/^[a-zA-Z]$/.test(e.key) ? e.key.toUpperCase() : null);
    if (!pressedLetter) return;
    for (var i = 0; i < state.players.length; i++) {
      if (state.players[i].key === pressedLetter) {
        handleBuzz(state.players[i].id);
        break;
      }
    }
  });

  // ---------------- rendering ----------------
  function renderBuzzStage() {
    var stage = el.buzzStage;
    stage.classList.remove('locked', 'solved');

    if (state.currentId !== null) {
      stage.classList.add('locked');
      var p = findPlayer(state.currentId);
      var timeStr = state.lastElapsed.toFixed(2);
      stage.innerHTML =
        '<div class="qm-buzz-name">' + escapeHtml(p ? p.name : '') + ' さん</div>' +
        '<div class="qm-buzz-time">' + timeStr + ' 秒</div>';
      el.judgeRow.classList.remove('qm-hidden');
      return;
    }

    if (state.solved) {
      stage.classList.add('solved');
      stage.innerHTML = '<div class="qm-buzz-result-tag">🎉 正解が確定しました。次の問題は「問題を始める」を押してください。</div>';
      el.judgeRow.classList.add('qm-hidden');
      return;
    }

    if (state.roundEnded) {
      stage.innerHTML = '<div class="qm-buzz-idle">この問題は終了しました。次の問題は「問題を始める」を押してください。</div>';
      el.judgeRow.classList.add('qm-hidden');
      return;
    }

    if (state.quizActive) {
      var elapsedNow = (performance.now() - state.startTime) / 1000;
      stage.innerHTML =
        '<div class="qm-buzz-clock">' + elapsedNow.toFixed(2) + '</div>' +
        '<div class="qm-buzz-clock-label">秒経過 ー 解答受付中</div>';
      el.judgeRow.classList.add('qm-hidden');
      return;
    }

    stage.innerHTML = '<div class="qm-buzz-idle">「問題を始める」を押すと解答受付が始まります</div>';
    el.judgeRow.classList.add('qm-hidden');
  }

  function renderBuzzerGrid() {
    if (state.players.length === 0) {
      el.buzzerGrid.classList.add('qm-hidden');
      el.emptyState.classList.remove('qm-hidden');
      el.scoreboardCard.classList.add('qm-hidden');
      return;
    }
    el.emptyState.classList.add('qm-hidden');
    el.buzzerGrid.classList.remove('qm-hidden');
    el.scoreboardCard.classList.remove('qm-hidden');

    var html = '';
    state.players.forEach(function (p) {
      var cls = 'qm-buzzer';
      var order = null;
      if (state.currentId === p.id) {
        cls += ' active';
      } else if (state.quizActive && state.rule === 'single' && state.singleLocked) {
        cls += ' out';
      } else if (state.quizActive && state.rule === 'rest' && state.restingSet[p.id]) {
        cls += ' out';
      } else if (state.quizActive && state.rule === 'endless') {
        for (var i = 0; i < state.queue.length; i++) {
          if (state.queue[i].id === p.id) { order = i + 1; break; }
        }
        if (order) cls += ' queued';
      }
      html += '<button type="button" class="' + cls + '" data-id="' + p.id + '">' +
        (order ? '<span class="qm-buzzer-order">' + order + '</span>' : '') +
        '<span>' + escapeHtml(p.name) + '</span>' +
        '<span class="qm-buzzer-key">' + p.key + '</span>' +
        '</button>';
    });
    el.buzzerGrid.innerHTML = html;
  }

  function renderScoreboard() {
    closeKebabMenu();
    var html = '';
    state.players.forEach(function (p) {
      var controlHtml;
      if (state.scoreMode === 'count') {
        controlHtml =
          '<div class="qm-count-control">' +
          '<span class="qm-count-value qm-count-correct" data-count="correct" data-id="' + p.id + '" title="クリックで+1 / 右クリックで-1">' + (p.correct || 0) + '○</span>' +
          '<span class="qm-count-value qm-count-wrong" data-count="wrong" data-id="' + p.id + '" title="クリックで+1 / 右クリックで-1">' + (p.wrong || 0) + '✕</span>' +
          '</div>';
      } else {
        controlHtml =
          '<div class="qm-score-control">' +
          '<button class="qm-score-btn" type="button" data-action="score-dec" data-id="' + p.id + '" aria-label="点数を減らす">−</button>' +
          '<span class="qm-score-value">' + p.score + '</span>' +
          '<button class="qm-score-btn" type="button" data-action="score-inc" data-id="' + p.id + '" aria-label="点数を増やす">＋</button>' +
          '</div>';
      }
      html += '<div class="qm-participant-row' + (state.currentId === p.id ? ' is-turn' : '') + '">' +
        '<span class="qm-participant-key">' + p.key + '</span>' +
        '<span class="qm-participant-name">' + escapeHtml(p.name) + '</span>' +
        controlHtml +
        '<button class="qm-kebab-btn" type="button" data-action="kebab" data-id="' + p.id + '" aria-label="メニュー" aria-haspopup="true">⋮</button>' +
        '</div>';
    });
    el.scoreboardList.innerHTML = html;
    savePlayers();
  }

  function renderAll() {
    renderBuzzStage();
    renderBuzzerGrid();
    renderScoreboard();
    el.btnStart.disabled = state.quizActive;
  }

  el.buzzerGrid.addEventListener('click', function (e) {
    var btn = e.target.closest('.qm-buzzer');
    if (!btn) return;
    handleBuzz(btn.getAttribute('data-id'));
  });

  el.scoreboardList.addEventListener('click', function (e) {
    var countEl = e.target.closest('[data-count]');
    if (countEl) {
      var cid = countEl.getAttribute('data-id');
      var cp = findPlayer(cid);
      if (cp) {
        var field = countEl.getAttribute('data-count');
        cp[field] = (cp[field] || 0) + 1;
        renderScoreboard();
      }
      return;
    }
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var id = actionEl.getAttribute('data-id');
    var action = actionEl.getAttribute('data-action');

    if (action === 'kebab') {
      e.stopPropagation();
      if (kebabTargetId === id && !el.kebabMenu.classList.contains('qm-hidden')) {
        closeKebabMenu();
      } else {
        openKebabMenu(actionEl, id);
      }
      return;
    }

    var p = findPlayer(id);
    if (!p) return;
    if (action === 'score-inc') { p.score += 1; renderScoreboard(); }
    else if (action === 'score-dec') { p.score -= 1; renderScoreboard(); }
  });

  el.scoreboardList.addEventListener('contextmenu', function (e) {
    var countEl = e.target.closest('[data-count]');
    if (!countEl) return;
    e.preventDefault();
    var id = countEl.getAttribute('data-id');
    var p = findPlayer(id);
    if (!p) return;
    var field = countEl.getAttribute('data-count');
    p[field] = Math.max(0, (p[field] || 0) - 1);
    renderScoreboard();
  });

  el.btnClearScores.addEventListener('click', function () {
    if (state.players.length === 0) return;
    if (!window.confirm('すべてのプレイヤーの点数・正誤カウントをクリアします。よろしいですか？')) return;
    state.players.forEach(function (p) { p.score = 0; p.correct = 0; p.wrong = 0; });
    setStatus('点数をクリアしました。', '');
    renderAll();
  });

  el.btnClearPlayers.addEventListener('click', function () {
    if (state.players.length === 0) return;
    if (!window.confirm('登録されているプレイヤーを全員削除します。よろしいですか？')) return;
    if (state.quizActive) endQuestion();
    state.players = [];
    state.currentId = null;
    setStatus('プレイヤーをクリアしました。', '');
    renderAll();
  });

  // ---- init ----
  loadPlayers();
  renderAll();
})();
</script>
</body>
</html>
